<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAV NAV — 3D Hospital Navigation Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-page: #F4F8FC;
      --panel-bg: #FFFFFF;
      --primary-blue: #2563EB;
      --secondary-blue: #60A5FA;
      --soft-blue: #DBEAFE;
      --text-primary: #16324F;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --shadow-sm: 0 1px 3px rgba(22, 50, 79, 0.05);
      --shadow-md: 0 4px 12px -2px rgba(22, 50, 79, 0.08);
      --shadow-lg: 0 10px 25px -3px rgba(22, 50, 79, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* Top Navigation Bar */
    header.app-header {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      height: 56px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: var(--primary-blue);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.5px;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
    }

    .brand-title {
      font-weight: 800;
      font-size: 17px;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary-blue);
      background: var(--soft-blue);
      padding: 3px 8px;
      border-radius: 20px;
      margin-left: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-header {
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-header:hover {
      background: var(--soft-blue);
      border-color: var(--secondary-blue);
      color: var(--primary-blue);
    }

    .btn-header.active {
      background: var(--primary-blue);
      color: #FFFFFF;
      border-color: var(--primary-blue);
    }

    /* Left Sidebar: Navigation & Controls */
    aside.sidebar {
      position: absolute;
      top: 84px;
      left: 20px;
      width: 340px;
      max-height: calc(100vh - 104px);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      z-index: 10;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 18px;
      gap: 16px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    select, input[type="text"] {
      width: 100%;
      height: 38px;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s ease;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .accessibility-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .accessibility-toggle input[type="checkbox"] {
      accent-color: var(--primary-blue);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Route Feedback Banner */
    .route-card {
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .route-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-demo {
      background: var(--primary-blue);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .route-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .stat-chip {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-chip.highlight {
      background: var(--soft-blue);
      border-color: var(--secondary-blue);
      color: var(--primary-blue);
    }

    .stat-chip.accessible {
      background: #DCFCE7;
      border-color: #86EFAC;
      color: #166534;
    }

    /* Playback controls */
    .playback-controls {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-primary {
      flex: 1;
      height: 38px;
      background: var(--primary-blue);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .btn-primary:hover {
      background: #1D4ED8;
    }

    .btn-outline {
      height: 38px;
      padding: 0 12px;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .btn-outline:hover {
      background: #F1F5F9;
      border-color: #CBD5E1;
    }

    .btn-outline.danger {
      color: #DC2626;
    }
    .btn-outline.danger:hover {
      background: #FEF2F2;
      border-color: #FCA5A5;
    }

    /* Turn-by-Turn step list */
    .step-list {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: #FFFFFF;
    }

    .step-item {
      padding: 8px 10px;
      border-bottom: 1px solid #F1F5F9;
      font-size: 11px;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .step-item:last-child {
      border-bottom: none;
    }

    .step-item.active {
      background: var(--soft-blue);
      font-weight: 600;
      color: var(--primary-blue);
    }

    .step-num {
      background: #E2E8F0;
      color: var(--text-primary);
      font-weight: 700;
      font-size: 9px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-item.active .step-num {
      background: var(--primary-blue);
      color: #FFFFFF;
    }

    /* Right Floor Switcher Floating Card */
    .floor-widget {
      position: absolute;
      top: 84px;
      right: 20px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      z-index: 10;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 160px;
    }

    .floor-widget-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .floor-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 34px;
      padding: 0 10px;
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      transition: all 0.15s ease;
    }

    .floor-pill:hover {
      background: var(--soft-blue);
      color: var(--primary-blue);
      border-color: var(--secondary-blue);
    }

    .floor-pill.active {
      background: var(--primary-blue);
      color: #FFFFFF;
      border-color: var(--primary-blue);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .floor-badge {
      font-size: 9px;
      font-weight: 700;
      background: rgba(0,0,0,0.06);
      padding: 2px 5px;
      border-radius: 4px;
    }

    .floor-pill.active .floor-badge {
      background: rgba(255,255,255,0.25);
      color: #FFFFFF;
    }

    /* Bottom Inspection Bar (Floor Separation & View Modes) */
    .bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      z-index: 10;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .view-mode-group {
      display: flex;
      gap: 6px;
      border-right: 1px solid var(--border-color);
      padding-right: 18px;
    }

    .btn-toggle {
      height: 32px;
      padding: 0 12px;
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-toggle:hover {
      background: var(--soft-blue);
      color: var(--primary-blue);
    }

    .btn-toggle.active {
      background: var(--primary-blue);
      color: #FFFFFF;
      border-color: var(--primary-blue);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .slider-container input[type="range"] {
      width: 110px;
      accent-color: var(--primary-blue);
      cursor: pointer;
    }

    /* Camera Follow Pill */
    #resume-follow-btn {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-blue);
      color: #FFFFFF;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      z-index: 10;
      display: none;
      align-items: center;
      gap: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.04); }
    }

    /* Responsive mobile tweaks */
    @media (max-width: 820px) {
      aside.sidebar {
        width: calc(100vw - 40px);
        max-height: 48vh;
        top: auto;
        bottom: 74px;
        left: 20px;
      }
      .floor-widget {
        top: 80px;
        right: 20px;
      }
      .bottom-bar {
        bottom: 12px;
        padding: 6px 12px;
        gap: 10px;
      }
      .view-mode-group {
        padding-right: 10px;
      }
    }
  </style>
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo">H</div>
      <div class="brand-title">HAV NAV</div>
      <span class="brand-badge">Hospital 3D Explorer</span>
    </div>
    <div class="header-actions">
      <button class="btn-header" id="roof-toggle-btn" title="Toggle Roof Visibility">
        <span>Roof:</span> <strong id="roof-status-text">Visible</strong>
      </button>
      <button class="btn-header" id="glass-toggle-btn" title="Toggle Exterior Glazing">
        <span>Façade:</span> <strong id="glass-status-text">Tinted</strong>
      </button>
      <button class="btn-header" id="reset-cam-btn" title="Reset Camera View">
        Reset View
      </button>
    </div>
  </header>

  <!-- Left Sidebar (Wayfinding & Demo Playback) -->
  <aside class="sidebar">
    <div class="section-title">
      <span>Navigation Route</span>
      <span class="badge-demo">Demo Mode</span>
    </div>

    <div class="form-group">
      <label for="start-select">Starting Point</label>
      <select id="start-select">
        <optgroup label="Campus & Parking">
          <option value="n-G-accessible-parking">Accessible Parking (North Bay)</option>
          <option value="n-G-visitor-parking">Visitor Parking (North Lot)</option>
          <option value="n-G-dropoff">Drop-Off Canopy</option>
          <option value="n-G-ambulance-bay">Ambulance Bay (Emergency)</option>
        </optgroup>
        <optgroup label="Ground Floor (G)">
          <option value="n-G-main-entrance" selected>Main Entrance Lobby</option>
          <option value="n-G-reception">Central Reception Desk</option>
          <option value="n-G-triage">Emergency Triage</option>
          <option value="n-G-pharmacy">Outpatient Pharmacy</option>
          <option value="n-G-mri">MRI & CT Diagnostics</option>
        </optgroup>
        <optgroup label="Level 1 (L1)">
          <option value="n-F1-consultation">Consultation Suites (L1)</option>
          <option value="n-F1-pediatrics">Pediatric Clinic (L1)</option>
        </optgroup>
        <optgroup label="Level 2 (L2)">
          <option value="n-F2-cardiology">Cardiology Center (L2)</option>
          <option value="n-F2-icu">Intensive Care Unit (L2)</option>
        </optgroup>
      </select>
    </div>

    <div class="form-group">
      <label for="dest-select">Destination</label>
      <select id="dest-select">
        <optgroup label="Level 2 (L2)">
          <option value="n-F2-cardiology" selected>L2 — Cardiology Center (Room 204)</option>
          <option value="n-F2-icu">L2 — Intensive Care Unit (ICU)</option>
          <option value="n-F2-ot1">L2 — Operating Theater 1</option>
        </optgroup>
        <optgroup label="Level 3 (L3)">
          <option value="n-F3-pediatrics">L3 — Patient Rooms & Recovery (Ward 302)</option>
          <option value="n-F3-oncology">L3 — Oncology Day Ward</option>
        </optgroup>
        <optgroup label="Level 1 (L1)">
          <option value="n-F1-consultation">L1 — Consultation Suite 102</option>
          <option value="n-F1-pediatrics">L1 — Outpatient Clinic 106</option>
        </optgroup>
        <optgroup label="Ground Floor (G)">
          <option value="n-G-pharmacy">G — Pharmacy & Dispensary</option>
          <option value="n-G-radiology">G — Radiology / X-Ray</option>
          <option value="n-G-emergency">G — Emergency Trauma</option>
        </optgroup>
      </select>
    </div>

    <div class="accessibility-toggle" id="acc-toggle-container">
      <label for="acc-checkbox" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 16px;">♿</span> Step-Free Accessible Route
      </label>
      <input type="checkbox" id="acc-checkbox" checked>
    </div>

    <!-- Active Route Card -->
    <div class="route-card" id="route-card">
      <div class="route-header">
        <span style="font-size: 12px; font-weight: 700; color: var(--text-primary);">Route Computed</span>
        <span style="font-size: 11px; font-weight: 600; color: var(--text-muted);" id="current-floor-indicator">Floor: G</span>
      </div>

      <div class="route-stats">
        <div class="stat-chip highlight" id="est-dist-chip">est. 65 m</div>
        <div class="stat-chip highlight" id="est-time-chip">est. 2 min</div>
        <div class="stat-chip accessible" id="acc-chip">Step-Free</div>
      </div>

      <div style="width: 100%; height: 6px; background: #E2E8F0; border-radius: 3px; overflow: hidden; margin: 4px 0;">
        <div id="route-progress-bar" style="width: 0%; height: 100%; background: var(--primary-blue); transition: width 0.1s linear;"></div>
      </div>

      <!-- Playback buttons -->
      <div class="playback-controls">
        <button class="btn-primary" id="play-pause-btn">
          <span id="play-btn-text">Start Walk</span>
        </button>
        <button class="btn-outline" id="restart-btn" title="Restart route">
          ↺
        </button>
        <button class="btn-outline danger" id="reset-route-btn" title="Reset navigation">
          Reset
        </button>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 2px;">
        <span>Playback Speed:</span>
        <div style="display: flex; gap: 4px;">
          <button class="btn-header" style="padding: 2px 6px; font-size: 10px;" id="speed-05">0.5x</button>
          <button class="btn-header active" style="padding: 2px 6px; font-size: 10px;" id="speed-10">1.0x</button>
          <button class="btn-header" style="padding: 2px 6px; font-size: 10px;" id="speed-20">2.0x</button>
        </div>
      </div>
    </div>

    <!-- Step Instructions -->
    <div class="section-title">Turn-By-Turn Steps</div>
    <div class="step-list" id="steps-container"></div>
  </aside>

  <!-- Right Persistent Floor Selectors (Strict Limit: 4 Floors) -->
  <div class="floor-widget">
    <div class="floor-widget-title">Hospital Levels</div>
    <button class="floor-pill" data-floor="L3" id="floor-btn-L3">
      <span>L3 Patient Rooms</span>
      <span class="floor-badge">4F</span>
    </button>
    <button class="floor-pill" data-floor="L2" id="floor-btn-L2">
      <span>L2 Surgery & ICU</span>
      <span class="floor-badge">3F</span>
    </button>
    <button class="floor-pill" data-floor="L1" id="floor-btn-L1">
      <span>L1 Consultation</span>
      <span class="floor-badge">2F</span>
    </button>
    <button class="floor-pill active" data-floor="G" id="floor-btn-G">
      <span>G Emergency</span>
      <span class="floor-badge">1F</span>
    </button>
  </div>

  <!-- Bottom Bar: Floor Separation & View Modes -->
  <div class="bottom-bar">
    <div class="view-mode-group">
      <button class="btn-toggle active" id="mode-assembled-btn">Assembled</button>
      <button class="btn-toggle" id="mode-exploded-btn">Exploded View</button>
      <button class="btn-toggle" id="mode-solo-btn">Solo Floor</button>
    </div>

    <div class="slider-container" id="separation-slider-container">
      <label for="spacing-slider">Floor Spacing:</label>
      <input type="range" id="spacing-slider" min="0" max="25" step="1" value="0">
      <span id="spacing-val-text" style="font-family: 'JetBrains Mono', monospace; font-size: 11px;">0 m</span>
    </div>
  </div>

  <!-- Resume Camera Follow Floating Button -->
  <button id="resume-follow-btn">
    <span>📍</span> Resume Follow Mode
  </button>

  <script>
    /* =========================================================================
       HAV NAV 3D HOSPITAL NAVIGATOR ENGINE (Three.js WebGL)
       Clean light hospital theme, strictly 4 occupied levels (G, L1, L2, L3),
       animated continuous polyline route, campus exterior, and floor separation.
       ========================================================================= */

    // Strict 4 Occupied Floors Specification
    const FLOOR_DATA = [
      { id: 'G',  level: 0, baseY: 0,  name: 'G — Emergency & Diagnostics', short: 'G', color: 0xDBEAFE },
      { id: 'L1', level: 1, baseY: 12, name: 'L1 — Consultation & Outpatient', short: 'L1', color: 0xEFF6FF },
      { id: 'L2', level: 2, baseY: 24, name: 'L2 — Surgery & Intensive Care', short: 'L2', color: 0xEFF6FF },

    // Compute Dijkstra Route
    function calculateRoute(startId, destId, stepFree) {
      const dists = {};
      const prev = {};
      const pq = [{ id: startId, d: 0 }];

      Object.keys(WAYPOINTS).forEach(k => { dists[k] = Infinity; });
      dists[startId] = 0;

      while (pq.length > 0) {
        pq.sort((a, b) => a.d - b.d);
        const { id, d } = pq.shift();
        if (id === destId) break;
        if (d > dists[id]) continue;

        const u = WAYPOINTS[id];
        EDGES.forEach(edge => {
          let vId = null;
          if (edge.from === id) vId = edge.to;
          else if (edge.to === id) vId = edge.from;
          if (!vId) return;

          if (stepFree && !edge.acc) return;

          const v = WAYPOINTS[vId];
          const physicalDist = Math.hypot(u.x - v.x, u.z - v.z) + Math.abs(u.y - v.y);
          const weight = edge.type === 'lift' ? 14 : physicalDist;
          const alt = dists[id] + weight;

          if (alt < dists[vId]) {
            dists[vId] = alt;
            prev[vId] = { from: id, type: edge.type, acc: edge.acc };
            pq.push({ id: vId, d: alt });
          }
        });
      }

      if (!prev[destId] && startId !== destId) return null;

      const path = [];
      let curr = destId;
      while (curr) {
        path.unshift(curr);
        curr = prev[curr] ? prev[curr].from : null;
      }

      // Calculate total physical meters and steps
      let totalMeters = 0;
      const steps = [];
      for (let i = 0; i < path.length; i++) {
        const node = WAYPOINTS[path[i]];
        let text = '';
        if (i === 0) {
          text = `Start at ${node.name}`;
        } else {
          const prevNode = WAYPOINTS[path[i - 1]];
          const d = Math.hypot(node.x - prevNode.x, node.z - prevNode.z) + Math.abs(node.y - prevNode.y);
          totalMeters += d;
          if (node.floor !== prevNode.floor) {
            text = `Take Elevator to Floor ${node.floor}`;
          } else {
            text = `Walk to ${node.name}`;
          }
        }
        steps.push({ text, floor: node.floor, node });
      }

      return {
        path,
        totalMeters: Math.round(totalMeters),
        minutes: Math.max(1, Math.round(totalMeters / 40)),
        steps
      };
    }

    /* =========================================================================
       4. ANIMATED HIGH-CONTRAST ROUTE & WALKER MARKER
       ========================================================================= */
    let routeLineMesh = null;
    let walkerGroup = null;
    let walkerHalo = null;

    function render3DRoute(routeObj) {
      if (routeLineMesh) {
        scene.remove(routeLineMesh);
        routeLineMesh.geometry.dispose();
        routeLineMesh = null;
      }

      if (!routeObj || routeObj.path.length < 2) return;

      const points = [];
      for (let i = 0; i < routeObj.path.length; i++) {
        const wp = WAYPOINTS[routeObj.path[i]];
        // Evaluate dynamic floor Y based on floor separation
        const floorY = getFloorVisualY(wp.floor);
        // Elevate slightly (+0.25) above walkable surface to eliminate z-fighting
        points.push(new THREE.Vector3(wp.x, floorY + (wp.y % 12) + 0.35, wp.z));
      }

      // Smooth path curve
      const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.1);
      const curvePoints = curve.getPoints(Math.max(50, points.length * 15));
      const tubeGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(curvePoints), 200, 0.4, 8, false);

      const routeMat = new THREE.MeshStandardMaterial({
        color: 0x2563EB,
        emissive: 0x1D4ED8,
        emissiveIntensity: 0.65,
        roughness: 0.2,
        metalness: 0.1
      });

      routeLineMesh = new THREE.Mesh(tubeGeo, routeMat);
      scene.add(routeLineMesh);

      // Create Walker Marker if not created
      if (!walkerGroup) {
        walkerGroup = new THREE.Group();
        
        // Central position sphere
        const markerSphere = new THREE.Mesh(
          new THREE.SphereGeometry(0.85, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0x2563EB, emissive: 0x60A5FA, emissiveIntensity: 0.8 })
        );
        markerSphere.position.y = 0.85;
        walkerGroup.add(markerSphere);

        // Direction Arrow Cone
        const arrowCone = new THREE.Mesh(
          new THREE.ConeGeometry(0.55, 1.4, 12),
          new THREE.MeshStandardMaterial({ color: 0xFFFFFF })
        );
        arrowCone.rotation.x = Math.PI / 2;
        arrowCone.position.set(0, 0.85, 1.2);
        walkerGroup.add(arrowCone);

        // Pulsating Halo
        const haloGeo = new THREE.RingGeometry(1.2, 1.6, 24);
        const haloMat = new THREE.MeshBasicMaterial({ color: 0x3B82F6, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
        walkerHalo = new THREE.Mesh(haloGeo, haloMat);
        walkerHalo.rotation.x = -Math.PI / 2;
        walkerHalo.position.y = 0.1;
        walkerGroup.add(walkerHalo);

        scene.add(walkerGroup);
      }

      walkerGroup.visible = true;
      updateWalkerPosition(0);
    }

    function getFloorVisualY(floorId) {
      const idx = FLOOR_DATA.findIndex(f => f.id === floorId);
      if (idx === -1) return 0;
      if (state.viewMode === 'solo') {
        return state.activeFloorId === floorId ? 0 : 9999; // hidden
      }
      return FLOOR_DATA[idx].baseY + (idx * state.floorSpacing);
    }

    function getPolylinePoint(progress) {
      if (!state.currentRoute || state.currentRoute.path.length < 2) return null;
      const pts = [];
      for (let i = 0; i < state.currentRoute.path.length; i++) {
        const wp = WAYPOINTS[state.currentRoute.path[i]];
        const fy = getFloorVisualY(wp.floor);
        pts.push(new THREE.Vector3(wp.x, fy + (wp.y % 12) + 0.35, wp.z));
      }

      // Total polyline length
      let totalLen = 0;
      const lens = [];
      for (let i = 1; i < pts.length; i++) {
        const l = pts[i].distanceTo(pts[i - 1]);
        lens.push(l);
        totalLen += l;
      }

      const targetDist = progress * totalLen;
      let accum = 0;
      for (let i = 0; i < lens.length; i++) {
        if (accum + lens[i] >= targetDist) {
          const segT = (targetDist - accum) / lens[i];
          const pos = new THREE.Vector3().lerpVectors(pts[i], pts[i + 1], segT);
          const tangent = new THREE.Vector3().subVectors(pts[i + 1], pts[i]).normalize();
          return { pos, tangent, fromFloor: WAYPOINTS[state.currentRoute.path[i]].floor };
        }
        accum += lens[i];
      }
      return { pos: pts[pts.length - 1], tangent: new THREE.Vector3(0, 0, 1), fromFloor: WAYPOINTS[state.currentRoute.path[pts.length - 1]].floor };
    }

    function updateWalkerPosition(progress) {
      if (!walkerGroup) return;
      const pt = getPolylinePoint(progress);
      if (!pt) return;

      walkerGroup.position.copy(pt.pos);
      if (pt.tangent.lengthSq() > 0.001) {
        walkerGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), pt.tangent);
      }

      // Update Current Floor Indicator & UI Steps
      document.getElementById('current-floor-indicator').textContent = `Floor: ${pt.fromFloor}`;
      document.getElementById('route-progress-bar').style.width = `${Math.round(progress * 100)}%`;

      // Update active turn step
      if (state.currentRoute && state.currentRoute.steps) {
        const stepIdx = Math.min(
          state.currentRoute.steps.length - 1,
          Math.floor(progress * state.currentRoute.steps.length)
        );
        document.querySelectorAll('.step-item').forEach((el, idx) => {
          el.classList.toggle('active', idx === stepIdx);
        });
      }

      // Smooth Camera Follow
      if (state.cameraFollow && state.simRunning) {
        const offset = new THREE.Vector3(0, 18, 28);
        const camTarget = pt.pos.clone().add(offset);
        camera.position.lerp(camTarget, 0.04);
        controls.target.lerp(pt.pos, 0.05);
      }
    }

    /* =========================================================================
       5. USER INTERFACE & CONTROLS BINDING
       ========================================================================= */
    function refreshRoute() {
      const startId = document.getElementById('start-select').value;
      const destId = document.getElementById('dest-select').value;
      const stepFree = document.getElementById('acc-checkbox').checked;

      const r = calculateRoute(startId, destId, stepFree);
      state.currentRoute = r;
      state.simProgress = 0;
      state.simRunning = false;
      document.getElementById('play-btn-text').textContent = 'Start Walk';

      if (!r) {
        document.getElementById('est-dist-chip').textContent = 'No route';
        document.getElementById('est-time-chip').textContent = 'Blocked';
        document.getElementById('steps-container').innerHTML = '<div class="step-item" style="color: #DC2626;">No step-free route available. Try unchecking step-free restriction.</div>';
        if (routeLineMesh) { scene.remove(routeLineMesh); routeLineMesh = null; }
        if (walkerGroup) walkerGroup.visible = false;
        return;
      }

      document.getElementById('est-dist-chip').textContent = `est. ${r.totalMeters} m`;
      document.getElementById('est-time-chip').textContent = `est. ${r.minutes} min`;

      // Populate Steps
      const stepsHtml = r.steps.map((s, idx) => `
        <div class="step-item ${idx === 0 ? 'active' : ''}">
          <div class="step-num">${idx + 1}</div>
          <div>${s.text}</div>
        </div>
      `).join('');
      document.getElementById('steps-container').innerHTML = stepsHtml;

      render3DRoute(r);
    }

    function updateFloorTransforms() {
      FLOOR_DATA.forEach((floor, idx) => {
        const grp = floorGroups[floor.id];
        if (!grp) return;

        if (state.viewMode === 'solo') {
          if (state.activeFloorId === floor.id) {
            grp.visible = true;
            grp.position.set(0, 0, 0); // Focus at eye height
          } else {
            grp.visible = false;
          }
        } else {
          grp.visible = true;
          const targetY = floor.baseY + (idx * state.floorSpacing);
          grp.position.set(0, targetY, 0);
        }
      });

      // Update route line geometry to follow moving floors!
      if (state.currentRoute) {
        render3DRoute(state.currentRoute);
      }
    }

    // Event Listeners
    document.getElementById('start-select').addEventListener('change', refreshRoute);
    document.getElementById('dest-select').addEventListener('change', refreshRoute);
    document.getElementById('acc-checkbox').addEventListener('change', refreshRoute);

    // Playback buttons
    const playPauseBtn = document.getElementById('play-pause-btn');
    playPauseBtn.addEventListener('click', () => {
      state.simRunning = !state.simRunning;
      if (state.simRunning) {
        state.cameraFollow = true;
        document.getElementById('resume-follow-btn').style.display = 'none';
        document.getElementById('play-btn-text').textContent = 'Pause';
      } else {
        document.getElementById('play-btn-text').textContent = 'Resume';
      }
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      state.simProgress = 0;
      updateWalkerPosition(0);
      state.simRunning = true;
      state.cameraFollow = true;
      document.getElementById('resume-follow-btn').style.display = 'none';
      document.getElementById('play-btn-text').textContent = 'Pause';
    });

    document.getElementById('reset-route-btn').addEventListener('click', () => {
      state.simProgress = 0;
      state.simRunning = false;
      state.cameraFollow = false;
      document.getElementById('resume-follow-btn').style.display = 'none';
      document.getElementById('play-btn-text').textContent = 'Start Walk';
      updateWalkerPosition(0);
    });

    // Speed options
    document.getElementById('speed-05').addEventListener('click', (e) => {
      state.simSpeed = 0.5;
      updateSpeedPills(e.target);
    });
    document.getElementById('speed-10').addEventListener('click', (e) => {
      state.simSpeed = 1.0;
      updateSpeedPills(e.target);
    });
    document.getElementById('speed-20').addEventListener('click', (e) => {
      state.simSpeed = 2.0;
      updateSpeedPills(e.target);
    });

    function updateSpeedPills(activeEl) {
      ['speed-05', 'speed-10', 'speed-20'].forEach(id => {
        document.getElementById(id).classList.remove('active');
      });
      activeEl.classList.add('active');
    }

    // Resume Follow Button
    document.getElementById('resume-follow-btn').addEventListener('click', () => {
      state.cameraFollow = true;
      document.getElementById('resume-follow-btn').style.display = 'none';
    });

    // Floor Switcher Pills (G, L1, L2, L3)
    ['G', 'L1', 'L2', 'L3'].forEach(fId => {
      document.getElementById(`floor-btn-${fId}`).addEventListener('click', () => {
        state.activeFloorId = fId;
        document.querySelectorAll('.floor-pill').forEach(el => el.classList.remove('active'));
        document.getElementById(`floor-btn-${fId}`).classList.add('active');
        if (state.viewMode === 'solo') {
          updateFloorTransforms();
        } else {
          // Frame target floor
          const idx = FLOOR_DATA.findIndex(f => f.id === fId);
          controls.target.set(0, FLOOR_DATA[idx].baseY + 4, 0);
        }
      });
    });

    // View Modes
    document.getElementById('mode-assembled-btn').addEventListener('click', () => {
      state.viewMode = 'assembled';
      state.floorSpacing = 0;
      document.getElementById('spacing-slider').value = 0;
      document.getElementById('spacing-val-text').textContent = '0 m';
      document.querySelectorAll('.btn-toggle').forEach(el => el.classList.remove('active'));
      document.getElementById('mode-assembled-btn').classList.add('active');
      updateFloorTransforms();
    });

    document.getElementById('mode-exploded-btn').addEventListener('click', () => {
      state.viewMode = 'exploded';
      state.floorSpacing = 12;
      document.getElementById('spacing-slider').value = 12;
      document.getElementById('spacing-val-text').textContent = '12 m';
      document.querySelectorAll('.btn-toggle').forEach(el => el.classList.remove('active'));
      document.getElementById('mode-exploded-btn').classList.add('active');
      updateFloorTransforms();
    });

    document.getElementById('mode-solo-btn').addEventListener('click', () => {
      state.viewMode = 'solo';
      document.querySelectorAll('.btn-toggle').forEach(el => el.classList.remove('active'));
      document.getElementById('mode-solo-btn').classList.add('active');
      updateFloorTransforms();
    });

    document.getElementById('spacing-slider').addEventListener('input', (e) => {
      state.floorSpacing = parseFloat(e.target.value);
      document.getElementById('spacing-val-text').textContent = `${state.floorSpacing} m`;
      if (state.viewMode !== 'exploded' && state.floorSpacing > 0) {
        state.viewMode = 'exploded';
        document.querySelectorAll('.btn-toggle').forEach(el => el.classList.remove('active'));
        document.getElementById('mode-exploded-btn').classList.add('active');
      }
      updateFloorTransforms();
    });

    // Roof Toggle
    document.getElementById('roof-toggle-btn').addEventListener('click', () => {
      if (state.roofState === 'visible') {
        state.roofState = 'faded';
        roofGroup.traverse(child => {
          if (child.material) {
            child.material.transparent = true;
            child.material.opacity = 0.25;
          }
        });
        document.getElementById('roof-status-text').textContent = 'Faded';
      } else if (state.roofState === 'faded') {
        state.roofState = 'hidden';
        roofGroup.visible = false;
        document.getElementById('roof-status-text').textContent = 'Hidden';
      } else {
        state.roofState = 'visible';
        roofGroup.visible = true;
        roofGroup.traverse(child => {
          if (child.material) {
            child.material.transparent = false;
            child.material.opacity = 1.0;
          }
        });
        document.getElementById('roof-status-text').textContent = 'Visible';
      }
    });

    // Façade Glass Toggle
    document.getElementById('glass-toggle-btn').addEventListener('click', () => {
      if (state.glassState === 'tinted') {
        state.glassState = 'transparent';
        document.getElementById('glass-status-text').textContent = 'Clear';
        setGlassOpacity(0.08);
      } else if (state.glassState === 'transparent') {
        state.glassState = 'hidden';
        document.getElementById('glass-status-text').textContent = 'Off';
        setGlassVisible(false);
      } else {
        state.glassState = 'tinted';
        document.getElementById('glass-status-text').textContent = 'Tinted';
        setGlassVisible(true);
        setGlassOpacity(0.28);
      }
    });

    function setGlassOpacity(op) {
      FLOOR_DATA.forEach(floor => {
        if (floorMeshes[floor.id]) {
          floorMeshes[floor.id].glass.forEach(mesh => {
            mesh.visible = true;
            mesh.material.opacity = op;
          });
        }
      });
    }

    function setGlassVisible(vis) {
      FLOOR_DATA.forEach(floor => {
        if (floorMeshes[floor.id]) {
          floorMeshes[floor.id].glass.forEach(mesh => {
            mesh.visible = vis;
          });
        }
      });
    }

    // Reset Camera
    document.getElementById('reset-cam-btn').addEventListener('click', () => {
      camera.position.set(70, 75, 100);
      controls.target.set(0, 16, 0);
      controls.update();
    });

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* =========================================================================
       6. RENDER & SIMULATION LOOP
       ========================================================================= */
    buildCampus();
    buildFloors();
    refreshRoute();

    let lastTime = performance.now();
    function animate(time) {
      requestAnimationFrame(animate);

      // Frame-rate independent delta calculation with clamping
      const rawDelta = (time - lastTime) / 1000;
      lastTime = time;
      const delta = Math.min(rawDelta, 0.1); // Clamp after tab suspension

      // Route playback update
      if (state.simRunning && state.currentRoute && state.currentRoute.totalMeters > 0) {
        // Assume walking speed ~1.4 m/s * speed multiplier
        const progressIncrement = (1.4 * state.simSpeed * delta) / state.currentRoute.totalMeters;
        state.simProgress += progressIncrement;

        if (state.simProgress >= 1.0) {
          state.simProgress = 1.0;
          state.simRunning = false;
          document.getElementById('play-btn-text').textContent = 'Restart';
        }
        updateWalkerPosition(state.simProgress);
      }

      // Animate walker pulsating halo ring
      if (walkerHalo) {
        const s = 1.0 + Math.sin(time * 0.005) * 0.25;
        walkerHalo.scale.set(s, s, s);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate(performance.now());
  </script>
</body>
</html>
